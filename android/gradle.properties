org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Required (not just a CLI flag) so `:domain:test`/`:protocol:test` never
# evaluate `:app`'s build script, which declares the Android/Kotlin-Android
# plugins directly and would otherwise be resolved/configured even for
# unrelated task requests. See android/build.gradle.kts's comment.
org.gradle.configureondemand=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
